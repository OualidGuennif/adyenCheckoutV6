services:
  - type: web
    name: ipp-endless-aisle
    runtime: docker
    dockerfilePath: ./apps/adyen-ipp-endless-aisle/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://ipp-endless-aisle.onrender.com
      - key: DATABASE_PATH
        value: /var/data/ipp.sqlite
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_TERMINAL_ID
        sync: false
      - key: ADYEN_HMAC_KEY
        sync: false
    disk:
      name: ipp-data
      mountPath: /var/data
      sizeGB: 1
