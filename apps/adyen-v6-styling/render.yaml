services:
  - type: web
    name: dropin-styling
    runtime: docker
    dockerfilePath: ./apps/adyen-v6-styling/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://styling.payments-playground.com
      - key: DATABASE_PATH
        value: /var/data/styling.sqlite
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
    disk:
      name: styling-data
      mountPath: /var/data
      sizeGB: 1
