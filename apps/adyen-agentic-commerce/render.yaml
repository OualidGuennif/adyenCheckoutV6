services:
  - type: web
    name: adyen-agentic-commerce
    runtime: docker
    dockerfilePath: ./apps/adyen-agentic-commerce/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-agentic-commerce.onrender.com
      - key: DATABASE_PATH
        value: /var/data/agentic.sqlite
      - key: AGENTIC_REAL_ENABLED
        value: "false"
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
      - key: ADYEN_AGENTIC_BEARER_TOKEN
        sync: false
    disk:
      name: agentic-data
      mountPath: /var/data
      sizeGB: 1
