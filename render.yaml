services:
  # The front door. A static site: it has no server work to do, costs nothing
  # on Render, and cannot quietly become a fifth app to maintain.
  - type: web
    name: payments-playground-landing
    runtime: static
    staticPublishPath: ./apps/landing
    buildCommand: ""
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: web
    name: adyen-digital
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/adyen-digital/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-digital.onrender.com
      - key: DATABASE_PATH
        value: /var/data/digital.sqlite
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
      - key: ADYEN_HMAC_KEY
        sync: false
    disk:
      name: digital-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: ipp-endless-aisle
    runtime: docker
    plan: free
    dockerfilePath: ./apps/adyen-ipp-endless-aisle/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://ipp-endless-aisle.onrender.com
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_TERMINAL_ID
        sync: false
      - key: ADYEN_HMAC_KEY
        sync: false

  - type: web
    name: adyen-agentic-commerce
    runtime: docker
    plan: free
    dockerfilePath: ./apps/adyen-agentic-commerce/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-agentic-commerce.onrender.com
      - key: AGENTIC_REAL_ENABLED
        value: "false"
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
      - key: ADYEN_AGENTIC_BEARER_TOKEN
        sync: false

  - type: web
    name: adyen-v6-styling
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/adyen-v6-styling/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-v6-styling.onrender.com
      - key: DATABASE_PATH
        value: /var/data/styling.sqlite
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
    disk:
      name: styling-data
      mountPath: /var/data
      sizeGB: 1
