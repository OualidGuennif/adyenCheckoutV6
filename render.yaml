services:
  - type: web
    name: adyen-digital
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/adyen-digital/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-digital.onrender.com
      - key: DATABASE_PATH
        value: /var/data/digital.sqlite
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
      - key: ADYEN_HMAC_KEY
        sync: false
    disk:
      name: digital-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: ipp-endless-aisle
    runtime: docker
    plan: free
    dockerfilePath: ./apps/adyen-ipp-endless-aisle/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://ipp-endless-aisle.onrender.com
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_TERMINAL_ID
        sync: false
      - key: ADYEN_HMAC_KEY
        sync: false

  - type: web
    name: adyen-agentic-commerce
    runtime: docker
    plan: free
    dockerfilePath: ./apps/adyen-agentic-commerce/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-agentic-commerce.onrender.com
      - key: AGENTIC_REAL_ENABLED
        value: "false"
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
      - key: ADYEN_AGENTIC_BEARER_TOKEN
        sync: false

  - type: web
    name: adyen-v6-styling
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/adyen-v6-styling/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://adyen-v6-styling.onrender.com
      - key: DATABASE_PATH
        value: /var/data/styling.sqlite
      - key: PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: ADYEN_API_KEY
        sync: false
      - key: ADYEN_MERCHANT_ACCOUNT
        sync: false
      - key: ADYEN_CLIENT_KEY
        sync: false
    disk:
      name: styling-data
      mountPath: /var/data
      sizeGB: 1
